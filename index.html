<title>Social Delas · Protótipo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@500;600;700;800&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: brand = sunset pink + script "Social" + spaced caps "DELAS". Hero split (lockup | poster), marquee, about, ticket stubs on sunset, schedule, quote band, local+FAQ, CTA, footer. Single committed light look. */
:root{
  color-scheme:light;
  --pink:#E8177D; --pink-deep:#B30F5E; --pink-soft:#FFD3E6; --blush:#FFF2F7; --peach:#FFB48A; --sun:#FF8757;
  --ink:#2A0F1E; --muted:#86566D; --line:#F5CFE0; --card:#FFFFFF; --white:#FFFFFF;
  --ok:#14804A; --ok-bg:#DCF5E7; --warn:#A15C07; --warn-bg:#FFEFD2; --bad:#C2185B; --bad-bg:#FFE0EC;
  --qr-bg:#FFFFFF; --qr-fg:#2A0F1E;
  --sunset:linear-gradient(170deg,#F7A6CF 0%,#FBB3C9 38%,#FFC3A0 72%,#FF9F70 100%);
  --pinkgrad:linear-gradient(120deg,#E8177D 0%,#F0447F 45%,#FF8757 100%);
  --f-script:"Great Vibes", "Brush Script MT", cursive;
  --f-head:"Montserrat", "Segoe UI", system-ui, sans-serif;
  --f-body:"Nunito", "Segoe UI", system-ui, sans-serif;
  --f-mono:ui-monospace, "Cascadia Mono", Consolas, monospace;
  --shadow:0 24px 60px -28px rgba(179,15,94,.45);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--blush);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--pink-deep)}
h1,h2,h3,h4{font-family:var(--f-head);line-height:1.1;margin:0;text-wrap:balance;font-weight:800}
p{margin:0}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
img{display:block}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.script{font-family:var(--f-script);font-weight:400;letter-spacing:0}
.caps{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.32em;font-weight:600}
.eyebrow{font-family:var(--f-head);font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--pink)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
.hint{font-size:.85rem;color:var(--muted)}

/* demo bar */
.demobar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--pink-deep);color:var(--white)}
.demobar .wrap{display:flex;align-items:center;gap:10px;padding-block:7px;flex-wrap:wrap}
.demobar .tag{font-family:var(--f-head);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;opacity:.85;flex:1 1 220px;min-width:0;font-weight:600}
.demobar nav{display:flex;gap:4px;flex-wrap:wrap}
.demobar nav button{background:transparent;border:1px solid transparent;color:var(--white);padding:5px 12px;border-radius:99px;cursor:pointer;font-size:.8rem;font-weight:700;font-family:var(--f-head)}
.demobar nav button[aria-current="true"]{background:var(--white);color:var(--pink-deep)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:99px;padding:14px 26px;font-family:var(--f-head);font-weight:700;font-size:.92rem;letter-spacing:.02em;cursor:pointer;text-decoration:none;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px)}
.btn-primary{background:var(--pinkgrad);color:var(--white);box-shadow:0 12px 28px -12px rgba(232,23,125,.8)}
.btn-white{background:var(--white);color:var(--pink-deep)}
.btn-ghost{background:rgba(255,255,255,.7);border:1.5px solid var(--line);color:var(--ink)}
.btn-outline-w{background:transparent;border:1.5px solid rgba(255,255,255,.8);color:var(--white)}
.btn-sm{padding:9px 16px;font-size:.82rem}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}

/* site header */
.sitehead{position:absolute;left:0;right:0;z-index:5}
.sitehead .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.sitehead .brand img{height:78px;width:auto}
.navpill{display:flex;gap:4px;align-items:center;background:rgba(255,255,255,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:5px 5px 5px 18px;border-radius:99px;border:1px solid rgba(255,255,255,.7)}
.navpill a.lk{text-decoration:none;font-family:var(--f-head);font-weight:600;font-size:.85rem;padding:6px 10px}
@media (max-width:820px){.navpill a.hide-m{display:none}.sitehead .brand img{height:46px}}
.sitehead.solid{position:relative;background:var(--white);border-bottom:1px solid var(--line)}
.sitehead.solid .navpill{background:var(--blush)}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--sunset);isolation:isolate}
.hero::before{content:"";position:absolute;inset:-60px;background:url("assets/banner.webp") center 70%/cover;filter:blur(34px) saturate(1.15);opacity:.55;z-index:-2;transform:scale(1.1)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,236,244,.86) 0%,rgba(255,226,238,.55) 48%,rgba(255,220,230,0) 75%);z-index:-1}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;padding-block:120px 80px}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr;gap:40px;padding-block:96px 56px}.hero::after{background:linear-gradient(180deg,rgba(255,236,244,.85),rgba(255,226,238,.55))}}
.kicker{display:inline-flex;gap:10px;align-items:center;background:var(--white);border-radius:99px;padding:7px 16px 7px 8px;font-family:var(--f-head);font-weight:700;font-size:.8rem;box-shadow:0 8px 24px -14px rgba(179,15,94,.6)}
.kicker b{background:var(--pinkgrad);color:var(--white);border-radius:99px;padding:3px 10px;font-size:.72rem;letter-spacing:.06em}
.lockup{margin-top:20px;display:grid;justify-items:start}
.lockup .s{font-family:var(--f-script);font-size:clamp(5.4rem,13vw,10.5rem);line-height:.85;color:var(--ink);margin-left:-.04em}
.lockup .d{display:flex;align-items:center;gap:16px;margin-top:6px;color:var(--pink);font-family:var(--f-head);font-weight:600;font-size:clamp(1.4rem,3.2vw,2.3rem);letter-spacing:.42em;padding-left:.2em}
.lockup .d::before,.lockup .d::after{content:"";width:44px;height:3px;background:var(--pink);border-radius:3px}
.lockup .t{font-family:var(--f-script);color:var(--pink);font-size:clamp(1.9rem,4vw,2.9rem);line-height:1.1;margin-top:4px}
.hero .lede{max-width:44ch;margin-top:20px;font-size:1.08rem;color:#4A1F33}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.facts{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:28px;font-family:var(--f-head);font-weight:600;font-size:.88rem}
.facts span{display:inline-flex;align-items:center;gap:8px}
.facts svg{color:var(--pink)}
.posterwrap{position:relative;justify-self:center;width:min(380px,100%)}
.poster{border-radius:30px;overflow:hidden;box-shadow:0 40px 80px -30px rgba(120,10,60,.55);transform:rotate(3deg);border:6px solid var(--white);aspect-ratio:9/14;max-width:100%}
.poster img{width:100%;height:100%;object-fit:cover;object-position:center 30%}
.glass{background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:var(--shadow)}
.cdcard{position:absolute;left:-44px;bottom:36px;padding:14px 16px;display:grid;gap:8px;transform:rotate(-3deg)}
@media (max-width:520px){.cdcard{left:-6px;bottom:-24px}}
.countdown{display:grid;grid-template-columns:repeat(4,auto);gap:12px}
.countdown div{text-align:center}
.countdown b{display:block;font-family:var(--f-head);font-size:1.7rem;font-weight:800;line-height:1;color:var(--pink-deep);font-variant-numeric:tabular-nums}
.countdown small{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:var(--f-head);font-weight:600}
.offbadge{position:absolute;right:-18px;top:28px;width:112px;height:112px;border-radius:50%;background:var(--pinkgrad);color:var(--white);display:grid;place-items:center;text-align:center;transform:rotate(10deg);box-shadow:0 18px 40px -16px rgba(232,23,125,.9);font-family:var(--f-head);font-weight:800;line-height:1}
.offbadge span{display:block;font-size:1.9rem}
.offbadge small{display:block;font-size:.62rem;letter-spacing:.14em;margin-top:4px}
@media (max-width:520px){.offbadge{right:-4px;width:92px;height:92px}.offbadge span{font-size:1.5rem}}
.heart{position:absolute;color:var(--pink);opacity:.85;animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px) rotate(6deg)}}
@media (prefers-reduced-motion:reduce){.heart{animation:none}}

/* marquee */
.marquee{background:var(--pinkgrad);color:var(--white);overflow:hidden;white-space:nowrap;padding-block:12px}
.marquee .track{display:inline-flex;align-items:center;gap:34px;animation:mq 34s linear infinite}
.marquee .track span{font-family:var(--f-head);font-weight:700;text-transform:uppercase;letter-spacing:.24em;font-size:.9rem}
.marquee .track em{font-family:var(--f-script);font-style:normal;font-size:2rem;line-height:1}
@keyframes mq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.marquee .track{animation:none}}

/* sections */
.section{padding-block:88px}
.shead{display:grid;gap:10px;justify-items:center;text-align:center;margin-bottom:44px}
.shead h2{font-size:clamp(2rem,4.4vw,3.1rem);letter-spacing:-.02em}
.shead h2 .script{color:var(--pink);font-size:1.35em;line-height:.6;display:inline-block;transform:translateY(.08em)}
.shead p{max-width:52ch;color:var(--muted)}

.about{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:center}
@media (max-width:900px){.about{grid-template-columns:1fr;gap:36px}}
.about .pic{position:relative}
.about .pic img{width:100%;height:auto;border-radius:28px;box-shadow:var(--shadow);aspect-ratio:1;object-fit:cover;max-width:100%}
.about .pic .note{position:absolute;right:-14px;bottom:-22px;padding:14px 18px;max-width:230px}
.about .pic .note b{font-family:var(--f-script);font-size:2rem;color:var(--pink);line-height:1;display:block;font-weight:400}
@media (max-width:520px){.about .pic .note{right:8px}}
.about h2{font-size:clamp(2rem,4.2vw,3rem);letter-spacing:-.02em}
.about h2 .script{color:var(--pink);font-size:1.4em;line-height:.5;font-weight:400}
.about .body{display:grid;gap:18px}
.about .body>p{color:var(--muted);font-size:1.05rem;max-width:54ch}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:8px}
@media (max-width:640px){.pillars{grid-template-columns:1fr}}
.pillar{background:var(--white);border-radius:20px;padding:18px;display:grid;gap:8px;border:1px solid var(--line)}
.pillar .ic{width:42px;height:42px;border-radius:14px;background:var(--pink-soft);color:var(--pink);display:grid;place-items:center}
.pillar b{font-family:var(--f-head);font-size:.95rem}
.pillar p{color:var(--muted);font-size:.88rem;line-height:1.5}

/* tickets */
.tix-sec{background:var(--sunset);position:relative;overflow:hidden}
.tix-sec .shead h2{color:var(--ink)}
.tix-sec .shead p{color:#5A2840}
.tickets{display:grid;gap:22px;max-width:960px;margin:0 auto}
.ticket{display:grid;grid-template-columns:1fr 270px;filter:drop-shadow(0 22px 34px rgba(150,20,80,.28));
  -webkit-mask:radial-gradient(circle 16px at calc(100% - 270px) 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 16px at calc(100% - 270px) 100%,#0000 98%,#000) bottom/100% 51% no-repeat;
  mask:radial-gradient(circle 16px at calc(100% - 270px) 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 16px at calc(100% - 270px) 100%,#0000 98%,#000) bottom/100% 51% no-repeat}
.ticket .art{position:relative;min-height:190px;padding:24px 28px;color:var(--white);display:flex;flex-direction:column;justify-content:space-between;gap:14px;border-radius:22px 0 0 22px;overflow:hidden;
  background:linear-gradient(100deg,rgba(184,15,94,.88) 0%,rgba(232,23,125,.55) 50%,rgba(255,135,87,.25) 100%),url("assets/banner.webp") center 78%/cover}
.ticket .art .s{font-family:var(--f-script);font-size:3.4rem;line-height:.8;text-shadow:0 2px 14px rgba(90,0,40,.35)}
.ticket .art .d{font-family:var(--f-head);font-weight:600;letter-spacing:.4em;font-size:.8rem}
.ticket .art h3{font-size:1.5rem;letter-spacing:.02em;text-transform:uppercase}
.ticket .art p{font-size:.92rem;opacity:.95;max-width:40ch}
.ticket .stub{background:#FFF7FA;border-radius:0 22px 22px 0;padding:22px 24px 22px 28px;display:flex;flex-direction:column;justify-content:center;gap:10px;border-left:3px dotted #F4B9D1;position:relative}
.barcode{height:34px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 12px,var(--ink) 12px 13px,transparent 13px 16px);opacity:.85}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price s{color:var(--muted);font-size:.92rem}
.price b{font-family:var(--f-head);font-size:2.1rem;font-weight:800;letter-spacing:-.02em}
.ticket.off .art{filter:grayscale(.75) brightness(.95)}
.ticket.off .stub{opacity:.75}
.stamp{position:absolute;right:22px;top:50%;transform:translateY(-50%) rotate(-12deg);border:3px solid var(--white);color:var(--white);font-family:var(--f-head);font-weight:800;letter-spacing:.2em;padding:6px 14px;border-radius:8px;font-size:1.1rem}
@media (max-width:700px){
  .ticket{grid-template-columns:1fr;-webkit-mask:none;mask:none}
  .ticket .art{border-radius:22px 22px 0 0}
  .ticket .stub{border-radius:0 0 22px 22px;border-left:0;border-top:3px dotted #F4B9D1}
}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-head);font-size:.7rem;font-weight:700;letter-spacing:.04em;padding:4px 10px;border-radius:99px;white-space:nowrap;width:max-content}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.mute{background:#F3E6EC;color:var(--muted)}
.payicons{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:30px}
.payicons span{background:rgba(255,255,255,.75);border-radius:99px;padding:7px 14px;font-family:var(--f-head);font-weight:700;font-size:.78rem;color:var(--pink-deep)}

/* schedule */
.sched{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media (max-width:900px){.sched{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.sched{grid-template-columns:1fr}}
.slot{background:var(--white);border-radius:24px;padding:22px;display:grid;gap:8px;border:1px solid var(--line);position:relative;overflow:hidden}
.slot time{font-family:var(--f-head);font-weight:800;font-size:1.9rem;color:var(--pink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.slot b{font-family:var(--f-head);font-size:1rem}
.slot p{color:var(--muted);font-size:.9rem}
.slot.hl{background:var(--pinkgrad);color:var(--white);border:0}
.slot.hl time,.slot.hl p{color:var(--white)}

/* quote band */
.quote{background:var(--pink-deep);color:var(--white);text-align:center;position:relative;overflow:hidden}
.quote .wrap{padding-block:80px;display:grid;gap:10px;justify-items:center}
.quote .script{font-size:clamp(3rem,8vw,6rem);line-height:1}
.quote p.caps{font-size:.82rem;opacity:.85}

/* local + faq */
.split{display:grid;grid-template-columns:1fr 1fr;gap:48px}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.split h2{font-size:clamp(1.8rem,3.6vw,2.4rem);margin-bottom:18px}
.split h2 .script{color:var(--pink);font-size:1.4em;font-weight:400}
.mapbox{border-radius:28px;background:var(--pink-soft);aspect-ratio:4/3;max-width:100%;position:relative;overflow:hidden;display:grid;place-items:center;padding:24px}
.mapbox svg.map{position:absolute;inset:0;width:100%;height:100%}
.mapbox .pin{position:relative;display:grid;gap:4px;justify-items:center;text-align:center;padding:18px 22px;max-width:290px}
.mapbox .pin .dotpin{width:44px;height:44px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--pinkgrad);margin-bottom:8px;box-shadow:0 10px 20px -8px rgba(232,23,125,.8)}
details{background:var(--white);border-radius:18px;padding:16px 20px;border:1px solid var(--line)}
details+details{margin-top:10px}
summary{cursor:pointer;font-family:var(--f-head);font-weight:700;font-size:.95rem;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";flex:none;width:28px;height:28px;border-radius:50%;background:var(--pink-soft);color:var(--pink);display:grid;place-items:center;font-size:1.2rem;line-height:1}
details[open] summary::after{content:"–"}
details p{color:var(--muted);margin-top:10px;max-width:60ch}

/* final CTA + footer */
.cta{background:var(--sunset);text-align:center}
.cta .wrap{padding-block:80px;display:grid;gap:16px;justify-items:center}
.cta h2{font-size:clamp(2rem,4.6vw,3.2rem)}
.cta h2 .script{color:var(--pink-deep);font-weight:400;font-size:1.35em}
footer.sitefoot{background:var(--white);border-top:1px solid var(--line)}
footer.sitefoot .wrap{padding-block:36px;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:center}
footer.sitefoot img{height:86px;width:auto}
.socials{display:flex;gap:10px}
.socials span{width:42px;height:42px;border-radius:50%;background:var(--pink-soft);color:var(--pink);display:grid;place-items:center}

/* forms */
.field{display:grid;gap:6px}
.field label{font-family:var(--f-head);font-size:.76rem;font-weight:700;letter-spacing:.04em}
.field input,.field select{border:1.5px solid var(--line);background:var(--white);border-radius:14px;padding:12px 14px;width:100%;min-width:0}
.field input:focus,.field select:focus{border-color:var(--pink);outline:none;box-shadow:0 0 0 4px rgba(232,23,125,.12)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}

/* auth */
.authwrap{min-height:calc(100vh - 44px);display:grid;grid-template-columns:1fr 1fr}
@media (max-width:900px){.authwrap{grid-template-columns:1fr}.authwrap .art{min-height:260px}}
.authwrap .art{position:relative;background:url("assets/banner.webp") center 35%/cover;display:flex;align-items:flex-end;padding:40px}
.authwrap .art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(232,23,125,0) 40%,rgba(150,10,70,.78) 100%)}
.authwrap .art div{position:relative;z-index:1;color:var(--white);display:grid;gap:6px}
.authwrap .art .script{font-size:clamp(2.6rem,5vw,3.8rem);line-height:1}
.authform{display:grid;align-content:center;padding-block:48px;background:var(--white)}
.authform .box{max-width:410px;width:100%;margin:0 auto;display:grid;gap:16px}
.authform h1{font-size:1.9rem}
.authform h1 .script{color:var(--pink);font-weight:400;font-size:1.4em}
.tabs{display:flex;background:var(--blush);border-radius:99px;padding:4px;border:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:99px;font-family:var(--f-head);font-weight:700;font-size:.85rem;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--pinkgrad);color:var(--white)}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.82rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

/* conta */
.acct{background:var(--blush);min-height:70vh}
.acct-head{padding-block:40px 28px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:end}
.acct-head h1{font-size:clamp(2rem,5vw,3rem)}
.acct-head h1 .script{color:var(--pink);font-weight:400;font-size:1.4em}
.mytickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:22px;padding-bottom:64px}
.mt{background:var(--white);border-radius:26px;overflow:hidden;display:grid;box-shadow:var(--shadow)}

function qr(text){
  const n=25, r=rng(hash(text)), m=[];
  for(let y=0;y<n;y++){m[y]=[];for(let x=0;x<n;x++)m[y][x]=r()>.52}
  const finder=(ox,oy)=>{for(let y=-1;y<8;y++)for(let x=-1;x<8;x++){const X=ox+x,Y=oy+y;if(X<0||Y<0||X>=n||Y>=n)continue;m[Y][X]=x>=0&&y>=0&&x<7&&y<7&&(x===0||y===0||x===6||y===6||(x>=2&&x<=4&&y>=2&&y<=4))}};

(function seed(){

/* ---------- router ---------- */
const ROUTES=['inicio','entrar','conta','admin'];
function route(){const h=location.hash.slice(1);return ROUTES.includes(h)?h:'inicio'}
function go(r){if(location.hash.slice(1)===r)render();else location.hash=r;window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
function render(){
  const r=route();
  document.querySelectorAll('[data-go]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.go===r)));
  const app=$('#app');
  if(r==='inicio') app.innerHTML=viewSite();
  else if(r==='entrar') app.innerHTML=viewAuth();
  else if(r==='conta') app.innerHTML=S.user?viewConta():viewAuth('Entre para ver seus ingressos.');
  else if(r==='admin') app.innerHTML=S.admin?viewAdmin():viewAdminLogin();
  if(r==='inicio') tick();
}

function ticketRow(l){
  const st=loteState(l), left=l.total-soldOf(l.id);

  return `<article class="ticket ${st==='esgotado'?'off':''}">
    <div class="art">
      <div><div class="s">Social</div><div class="d">DELAS</div></div>
      <div><h3>${esc(l.name)}</h3><p>${esc(l.desc)}</p></div>
      ${st==='esgotado'?'<span class="stamp">ESGOTADO</span>':''}

      <div class="barcode" aria-hidden="true"></div></div>
  </article>`;
}
let cdTimer=null;
function tick(){
  clearInterval(cdTimer);
  const upd=()=>{const el=$('#cd');if(!el){clearInterval(cdTimer);return}
    const s=Math.max(0,Math.floor((EVENT.date-Date.now())/1000));const v=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60];
    el.querySelectorAll('b').forEach((b,i)=>b.textContent=pad(v[i]));};
  upd();cdTimer=setInterval(upd,1000);
}

    </div>

  <div class="panel" style="margin-top:14px"><h3>Últimos pedidos</h3><p class="sub">Atualiza sozinho quando um pagamento é confirmado</p>${orderTable(orders.slice().sort((a,b)=>b.date-a.date).slice(0,5))}</div>`;

function chart(){
  const days=14, W=640, H=230, pl=34, pr=8, pt=14, pb=30, now=new Date();now.setHours(0,0,0,0);
  const data=[];for(let i=days-1;i>=0;i--){const d=new Date(now-i*864e5),e=new Date(+d+864e5);const os=paid().filter(o=>o.date>=d&&o.date<e);data.push({d,n:os.reduce((s,o)=>s+o.qty,0),v:os.reduce((s,o)=>s+o.total,0)})}
  const mx=Math.max(1,...data.map(x=>x.n)), step=Math.max(1,Math.ceil(mx/4)), top=step*4;
  const ih=H-pt-pb, iw=W-pl-pr, bw=iw/days, w=Math.min(26,bw-6), y=v=>pt+ih-(v/top)*ih;
  let g='';for(let k=0;k<=4;k++){const v=step*k,yy=y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="#F5DCE7" stroke-width="1"/><text x="${pl-8}" y="${yy+4}" text-anchor="end">${v}</text>`}
  let b='';data.forEach((p,i)=>{const x=pl+i*bw+(bw-w)/2, y0=y(0), yt=y(p.n), h=y0-yt, r=Math.min(4,h);
    if(p.n>0)b+=`<path d="M${x} ${y0}V${yt+r}Q${x} ${yt} ${x+r} ${yt}H${x+w-r}Q${x+w} ${yt} ${x+w} ${yt+r}V${y0}Z" fill="#E8177D"/>`;
    if(i%2===(days-1)%2)b+=`<text x="${x+w/2}" y="${H-10}" text-anchor="middle">${dShort(p.d)}</text>`;
    b+=`<rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${ih}" fill="transparent" data-tip="${dShort(p.d)}|${p.n}|${brl(p.v)}" data-cx="${x+w/2}" data-cy="${Math.min(yt,y0-2)}"/>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingressos vendidos por dia nos últimos 14 dias">${g}<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="#C9A3B5" stroke-width="1"/>${b}</svg><div class="tip" id="tip" hidden></div>`;
}

    ${CO.qty>1?`<p class="hint">Os outros ${CO.qty-1} ingressos podem ser transferidos para suas amigas depois, pela sua conta.</p>`:''}`;

  } else if(s===3){

    body=`<div class="paytabs"><button data-act="method" data-v="pix" aria-pressed="${pix}"><b>Pix</b><small>Aprovação na hora</small></button><button data-act="method" data-v="card" aria-pressed="${!pix}"><b>Cartão de crédito</b><small>Até 12x</small></button></div>
    ${pix?`<div class="pixbox"><div class="qr">${qr('pix'+total+CO.email)}</div><div style="display:grid;gap:10px;min-width:0"><b style="font-family:var(--f-head)">Escaneie com o app do seu banco</b><span class="hint">Ou copie o código Pix:</span>
      <div class="copyline"><input id="pixcode" class="mono" readonly value="00020126580014BR.GOV.BCB.PIX0136a1b2c3d4-socialdelas-${Math.round(total*100)}5204000053039865802BR5912SOCIAL DELAS6009SAO PAULO6304A1F9" aria-label="Código Pix copia e cola"><button class="btn btn-ghost btn-sm" data-act="copypix">Copiar</button></div>
      <div class="waiting"><span class="dot"></span>Aguardando pagamento · expira em <b class="num" id="pixt">15:00</b></div></div></div>
      <p class="demo-note">No site real, esta tela confirma sozinha quando o banco avisa que o Pix caiu. Aqui, use o botão abaixo para simular.</p>`:

     <div class="grid2"><div class="field"><label for="cc-e">Validade</label><input id="cc-e" value="12/29"></div><div class="field"><label for="cc-c">CVV</label><input id="cc-c" value="123" inputmode="numeric"></div></div>

    foot=`<button class="btn btn-ghost" data-act="co-close">Fechar</button><button class="btn btn-primary" data-act="co-mine">Ver meus ingressos</button>`;

}
function finishPayment(){
  const {disc}=coTotals();
  const o=addOrder({name:CO.name,email:CO.email,loteId:CO.lote.id,qty:CO.qty,unit:CO.lote.price,discount:disc,method:CO.method==='pix'?'Pix':'Cartão',status:'pago',date:new Date()});
  if(CO.coupon)CO.coupon.uses++;
  if(!S.user||S.user.email!==CO.email)S.user={name:CO.name,email:CO.email};
  CO.order=o;CO.step=4;renderCO();render();
}

let toastT=null;
function toast(msg){$('#toast-root').innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>$('#toast-root').innerHTML='',3000)}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){go(g.dataset.go);return}
  const sc=e.target.closest('[data-scroll]'); if(sc){e.preventDefault();if(route()!=='inicio'){go('inicio');setTimeout(()=>{const el=document.getElementById(sc.dataset.scroll);if(el)el.scrollIntoView()},50);return}const el=document.getElementById(sc.dataset.scroll);if(el)el.scrollIntoView();return}
  const a=e.target.closest('[data-act]'); if(!a)return;
  const act=a.dataset.act, v=a.dataset.v;
  if(act==='co-overlay'){if(e.target===a){CO=null;renderCO()}return}
  if(a.tagName==='INPUT')return;
  switch(act){
    case 'buy': openCheckout(); break;
    case 'qty': CO.qty=Math.max(1,Math.min(4,CO.lote.total-soldOf(CO.lote.id),CO.qty+Number(v)));renderCO();break;
    case 'co-next':
      if(CO.step===2){CO.name=$('#b-name').value.trim()||CO.name;CO.email=$('#b-email').value.trim()||CO.email;CO.cpf=$('#b-cpf').value;CO.phone=$('#b-phone').value}
      CO.step++;renderCO();break;
    case 'co-back': CO.step--;renderCO();break;
    case 'method': CO.method=v;renderCO();break;
    case 'co-pay':
      if(CO.method==='card'){CO.inst=Number($('#cc-i').value);a.disabled=true;a.textContent='Processando…';setTimeout(finishPayment,900)}
      else finishPayment();break;
    case 'copypix':{const inp=$('#pixcode');const fb=()=>{inp.select();toast('Código selecionado. Use Ctrl+C para copiar.')};try{navigator.clipboard.writeText(inp.value).then(()=>toast('Código Pix copiado'),fb)}catch(err){fb()}break}
    case 'co-close': CO=null;renderCO();break;
    case 'co-mine': CO=null;renderCO();go('conta');break;
    case 'authtab': S.authTab=v;render();break;
    case 'login': S.user={...demoBuyer};toast('Login com Google simulado');go('conta');break;
    case 'forgot': e.preventDefault();toast('No site real, enviamos um link para redefinir a senha.');break;
    case 'logout': S.user=null;go('inicio');break;
    case 'transfer': toast('No site real, você digita o nome e o e-mail da amiga e o ingresso passa para ela.');break;
    case 'wallet': toast('No site real, o ingresso vai para a carteira do celular.');break;
    case 'atab': S.adminTab=v;if(v!=='checkin')S.scan=null;render();break;
    case 'alogout': S.admin=false;go('inicio');break;
    case 'ofilter': S.orderFilter=v;render();break;
    case 'csv': toast(`No site real, baixa uma planilha com ${filteredOrders().length} pedidos.`);break;
    case 'newlote': {const n=lotes.length+1;lotes.push({id:n,name:n+'º Lote',desc:'Novo lote.',price:200,from:200,total:50,active:false});toast(n+'º Lote criado (pausado)');render();break}
    case 'lsave': {const l=lotes.find(x=>x.id===Number(a.dataset.id));const p=Number($('#lp-'+l.id).value),t=Number($('#lt-'+l.id).value);if(p>0)l.price=p;if(t>=soldOf(l.id))l.total=t;toast(l.name+' atualizado. O site já mostra o novo valor.');render();break}
    case 'scan': {const pool=validTickets();checkCode(pool[Math.floor(Math.random()*pool.length)].code);break}
  }
});
document.addEventListener('change',e=>{
  const a=e.target.closest('[data-act="ltoggle"]'); if(a){const l=lotes.find(x=>x.id===Number(a.dataset.id));l.active=a.checked;toast(l.name+(l.active?' ativado':' pausado'));render()}
  if(e.target.id==='cc-i'&&CO){CO.inst=Number(e.target.value);renderCO()}
});
document.addEventListener('input',e=>{if(e.target.id==='oq'){S.orderQ=e.target.value;$('#otable').innerHTML=orderTable(filteredOrders())}});
document.addEventListener('submit',e=>{
  e.preventDefault();const id=e.target.id;
  if(id==='authform'){const em=$('#a-email').value.trim()||demoBuyer.email;const nm=$('#a-nome')?$('#a-nome').value.trim():(em===demoBuyer.email?demoBuyer.name:em.split('@')[0]);S.user={name:nm||'Convidada',email:em};toast(S.authTab==='criar'?'Conta criada':'Login feito');go('conta')}
  if(id==='adminform'){S.admin=true;S.adminTab='geral';render()}
  if(id==='cpform'){const c=coupons.find(x=>x.code===$('#cp').value.trim().toUpperCase());
    if(!c){CO.coupon=null;CO.couponMsg='Cupom não encontrado. Confira o código.'}
    else if(!c.active||c.uses>=c.limit){CO.coupon=null;CO.couponMsg='Este cupom não está mais disponível.'}
    else{CO.coupon=c;CO.couponMsg=`Cupom ${c.code} aplicado: ${c.type==='%'?c.value+'%':brl(c.value)} de desconto.`}renderCO()}
  if(id==='codeform'){checkCode($('#code').value)}
  if(id==='couponform'){const code=$('#c-code').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(!code){toast('Digite um código para o cupom.');return}if(coupons.some(c=>c.code===code)){toast('Já existe um cupom com esse código.');return}coupons.push({code,type:$('#c-type').value,value:Number($('#c-val').value)||10,uses:0,limit:Number($('#c-lim').value)||50,active:true});toast('Cupom '+code+' criado');render()}
  if(id==='eventform'){EVENT.name=$('#e-name').value;EVENT.edition=$('#e-ed').value;EVENT.dateLabel=$('#e-date').value;EVENT.time=$('#e-time').value;EVENT.place=$('#e-place').value;EVENT.city=$('#e-city').value;EVENT.about=$('#e-about').value;toast('Evento atualizado');go('inicio')}
});
function checkCode(raw){
  const code=String(raw).trim().toUpperCase(); if(!code)return;
  const t=validTickets().find(x=>x.code===code);
  if(!t)S.scan={kind:'none',code};
  else if(t.used)S.scan={kind:'used',t};
  else{t.used=true;t.usedAt=new Date();S.scan={kind:'ok',t}}
  render();
}
document.addEventListener('mouseover',e=>{
  const tip=$('#tip'); if(!tip)return;
  const r=e.target.closest('[data-tip]'); if(!r){tip.hidden=true;return}
  const svg=r.ownerSVGElement, box=svg.getBoundingClientRect(), wrap=$('#chart'), wb=wrap.getBoundingClientRect(), sx=box.width/svg.viewBox.baseVal.width;
  const [d,n,v]=r.dataset.tip.split('|');
  tip.innerHTML=`<b>${d}</b> · ${n} ingresso${n==='1'?'':'s'}<br>${v}`;
  tip.style.left=(box.left-wb.left+wrap.scrollLeft+Number(r.dataset.cx)*sx)+'px';
  tip.style.top=(box.top-wb.top+Number(r.dataset.cy)*sx)+'px';
  tip.hidden=false;
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&CO){CO=null;renderCO()}});
render();
})();
</script>
